<svg width="960" height="1100" viewBox="0 0 960 1100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI security portrait</title>
  <desc id="desc">A stylized cybersecurity and AI workspace portrait with code panels, circuit paths, and glowing accents.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#081A15" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="148" y1="125" x2="808" y2="977" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B352C"/>
      <stop offset="1" stop-color="#0B1C17"/>
    </linearGradient>
    <linearGradient id="accent" x1="221" y1="264" x2="741" y2="824" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="0.48" stop-color="#34D399"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="softShadow" x="40" y="42" width="880" height="1016" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="38" stdDeviation="36" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

